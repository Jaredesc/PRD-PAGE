<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrados - El nuevo PRD</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
        }

        .estrados-page {
            width: 100%;
            min-height: 100vh;
            padding-top: 80px;
            background: linear-gradient(135deg, #3d5a6c, #4a6fa5);
        }

        .estrados-section {
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            text-align: center;
        }

        .estrados-header h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .estrados-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 3rem;
            max-width: 800px;
            line-height: 1.4;
        }

        .estrados-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
            max-width: 900px;
        }

        .estrado-button {
            background: #f1c232;
            padding: 3rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .estrado-button:hover {
            background: #d4af37;
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .estrados-counter {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            font-size: 1.3rem;
            color: #f1c232;
        }

        .counter-number {
            background: #f1c232;
            color: #1a1a1a;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 2rem;
        }

        @media (max-width: 768px) {
            .estrados-page {
                padding-top: 60px;
            }

            .estrados-header h1 {
                font-size: 2.5rem;
            }

            .estrados-header h2 {
                font-size: 1.3rem;
            }

            .estrado-button {
                font-size: 1.4rem;
                padding: 2rem 1.5rem;
            }

            .estrados-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html" class="logo desktop-logo">El nuevo PRD</a>
            
            <div class="mobile-logo">
                <a href="index.html">
                    <img src="assets/images/logos/LOGO H BLANCO.png" alt="PRD Zacatecas" class="logo-img">
                </a>
            </div>
            
            <button class="hamburger" id="hamburger" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#documentos">DOCUMENTOS BÁSICOS</a></li>
                <li><a href="index.html#convocatorias">CONVOCATORIAS</a></li>
                <li><a href="index.html#directorio">DIRECTORIO</a></li>
                <li><a href="index.html#comunicacion">COMUNICACIÓN SOCIAL</a></li>
                <li><a href="index.html#afiliacion">AFILIACIÓN</a></li>
            </ul>
        </nav>
    </header>

    <div class="estrados-page">
        <section class="estrados-section">
            <div class="estrados-header">
                <h1>ESTRADOS</h1>
                <h2>CONVOCATORIAS, RESOLUCIONES Y ACUERDOS APROBADOS POR LAS AUTORIDADES PARTIDISTAS</h2>
            </div>

            <div class="estrados-buttons">
                <a href="estrados-consejo.html" class="estrado-button">
                    XI Consejo Estatal
                </a>
                <a href="estrados-direccion.html" class="estrado-button">
                    Dirección Ejecutiva
                </a>
            </div>


    <script src="js/main.js"></script>
</body>
</html>
